version: "3"
services:
  scraper:
    build: .
    container_name: scraper
    restart: always
    tmpfs:
      - /tmp:size=512m
    shm_size: 1g
    environment:
      BASE_URL: "http://tuequipo.local"
      USERNAME: "admin"
      PASSWORD: "1234"
      MQTT_BROKER: "192.168.1.10"
      MQTT_PORT: 1883
      MQTT_BASE_TOPIC: "casa/switch"
      INTERVAL: 60
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"